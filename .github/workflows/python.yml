# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_python3:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13.5]

    # Run inside the official Python image, since setup-python only ships prebuilt
    # interpreters for specific runner OS versions and may not cover the pinned version.
    container:
      image: python:${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-mock
        pip install .

    - name: Lint with flake8
      run: |
        flake8 --isolated --show-source --ignore=C901,E128,E201,E202,E203,E221,E225,E226,E227,E228,E231,E241,E251,E261,E262,E265,E271,E301,E302,E303,E305,E402,E501,W291,W293,W391 python

    - name: Test with pytest
      run: |
        pytest test/

